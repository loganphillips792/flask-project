{% extends "base.html" %}
{% block title %}{% if book %}Edit book{% else %}Add a new book{% endif %}{% endblock %}
{% block content %}
  <div class="card">
    <h1>{% if book %}Edit book{% else %}Add a new book{% endif %}</h1>
    <form method="post"
          action="{% if book %}{{ url_for('books.update', book_id=book.id) }}{% else %}{{ url_for('books.create') }}{% endif %}">
      <label for="title">Title</label>
      <input id="title" name="title" value="{{ title|default('') }}" required>

      <label for="author">Author</label>
      <input id="author" name="author" value="{{ author|default('') }}" required>

      <label for="isbn">ISBN</label>
      <input id="isbn" name="isbn" value="{{ isbn|default('') }}" required>

      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" name="quantity" min="1"
             value="{{ quantity|default(1, true) }}" required>

      <button type="submit">{% if book %}Save changes{% else %}Add book{% endif %}</button>
    </form>
  </div>
{% endblock %}
